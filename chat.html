<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Jarvis · Kunden-Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    border-bottom:1px solid rgba(255,255,255,0.12);
    font-size:14px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  header select{
    background:#000;
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:8px;
    padding:4px 8px;
    font-size:12px;
  }
  .btn-ghost{
    background:transparent;
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:8px 10px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  #chatWindow{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .msg{
    max-width:80%;
    padding:8px 10px;
    margin:4px 0;
    border-radius:12px;
    font-size:13px;
    line-height:1.4;
  }
  .from-me{
    margin-left:auto;
    background:#ffffff;
    color:#000;
  }
  .from-them{
    margin-right:auto;
    background:#111;
    color:#fff;
    border:1px solid rgba(255,255,255,0.15);
  }
  .meta{
    font-size:10px;
    opacity:0.7;
    margin-top:2px;
  }
  .empty{
    font-size:12px;
    color:#777;
    padding:8px 0;
  }
  .inputRow{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .inputRow input{
    flex:1;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.3);
    background:#080808;
    color:#fff;
    font-size:13px;
  }
  .inputRow button{
    padding:8px 12px;
    border-radius:10px;
    border:none;
    background:#fff;
    color:#000;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .info{
    font-size:11px;
    color:#aaa;
    margin:4px 0 2px;
  }
</style>
</head>
<body>
<header>
  <div>Jarvis · Kunden-Chat</div>
  <div style="display:flex; align-items:center; gap:8px;">
    <select id="clientSelect"></select>
    <button class="btn-ghost" onclick="window.close()">Schließen</button>
  </div>
</header>
<main>
  <div class="info">
    Kunde auswählen und Notizen / Chat-Verlauf pro Kunde pflegen.
  </div>
  <div id="chatWindow"></div>
  <div class="inputRow">
    <input id="msgInput" placeholder="Nachricht / Notiz an diesen Kunden…">
    <button onclick="sendMsg()">Send</button>
  </div>
</main>

<script>
function getClients(){
  return JSON.parse(localStorage.getItem("db_clients") || "[]");
}
function getChats(){
  return JSON.parse(localStorage.getItem("chats") || "[]");
}
function saveChats(chats){
  localStorage.setItem("chats", JSON.stringify(chats));
}

const clientSelect = document.getElementById("clientSelect");
const chatWindow = document.getElementById("chatWindow");
const msgInput = document.getElementById("msgInput");

function initClients(){
  const clients = getClients();
  clientSelect.innerHTML = "";

  if(clients.length === 0){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Keine Kunden erfasst";
    clientSelect.appendChild(opt);
    clientSelect.disabled = true;
  } else {
    clients.forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      clientSelect.appendChild(opt);
    });
    clientSelect.disabled = false;
  }
}

function renderChat(){
  chatWindow.innerHTML = "";
  const cid = clientSelect.value;
  if(!cid){
    chatWindow.innerHTML = '<div class="empty">Kein Kunde ausgewählt.</div>';
    return;
  }

  const chats = getChats().filter(m => m.clientId === cid)
    .sort((a,b)=> (a.time || "").localeCompare(b.time || ""));

  if(chats.length === 0){
    chatWindow.innerHTML = '<div class="empty">Noch keine Nachrichten zu diesem Kunden.</div>';
    return;
  }

  chats.forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg " + (m.who === "me" ? "from-me" : "from-them");
    const t = new Date(m.time || Date.now());
    const timeStr = t.toLocaleString("de-AT", { dateStyle:"short", timeStyle:"short" });

    div.innerHTML = `
      <div>${m.text}</div>
      <div class="meta">${m.who === "me" ? "Du" : (m.who || "System")} · ${timeStr}</div>
    `;
    chatWindow.appendChild(div);
  });

  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function sendMsg(){
  const text = msgInput.value.trim();
  if(!text) return;
  const cid = clientSelect.value;
  if(!cid) return;

  const chats = getChats();
  chats.push({
    clientId: cid,
    who: "me",
    text: text,
    time: new Date().toISOString()
  });
  saveChats(chats);
  msgInput.value = "";
  renderChat();
}

clientSelect.addEventListener("change", renderChat);
msgInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMsg();
  }
});

// Init
initClients();
renderChat();
</script>
</body>
</html>
