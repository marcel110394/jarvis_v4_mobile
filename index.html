<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Aichmayr Technology · Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #050507;
      color: #f9fafb;
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 230px;
      background: #020308;
      border-right: 1px solid #111827;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .logo span {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #e5e7eb;
      font-size: 13px;
      cursor: pointer;
    }
    .nav button.active {
      background: #111827;
      border-color: #1f2937;
    }
    .nav button:hover {
      background: #0b1120;
    }
    .nav small {
      font-size: 10px;
      color: #6b7280;
      display: block;
      margin-top: 2px;
    }
    .footer {
      margin-top: auto;
      font-size: 10px;
      color: #6b7280;
    }
    .footer span {
      display: block;
      margin-top: 2px;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    header .title {
      font-weight: 500;
    }
    header .badge {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #374151;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }
    iframe {
      border: none;
      flex: 1;
      width: 100%;
      background: #000;
    }
    @media (max-width: 800px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 10px;
      }
      .nav {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .footer { display: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      Aichmayr Technology
      <span>Smart Billing · Jarvis Core</span>
    </div>

    <div class="nav">
      <button class="active" data-target="rechnung.html">
        Invoices & Mahnwesen
        <small>Rechnungen, offene Posten, Erinnerungen</small>
      </button>
      <button data-target="spesen.html">
        Expenses & Travel
        <small>Spesen, Reisen, Reports</small>
      </button>
      <button data-target="dashboard.html">
        Finance Dashboard
        <small>Umsatz, Spesen, Gewinn</small>
      </button>
      <button data-target="about:blank" id="aiButton" disabled>
        KI-Assistent (coming soon)
        <small>Mahnungstexte, Angebote, Steuer-Zusammenfassung</small>
      </button>
    </div>

    <div class="footer">
      Jarvis Mode: <span>Local · Single User · v1.0</span>
    </div>
  </aside>

  <div class="content">
    <header>
      <div class="title" id="viewTitle">Invoices & Mahnwesen</div>
      <div class="badge">Control Panel</div>
    </header>
    <iframe id="mainFrame" src="rechnung.html"></iframe>
  </div>

  <script>
    const frame = document.getElementById('mainFrame');
    const title = document.getElementById('viewTitle');
    const buttons = document.querySelectorAll('.nav button[data-target]');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;

        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const target = btn.getAttribute('data-target');
        if (target && target !== 'about:blank') {
          frame.src = target;
        }

        const label = btn.firstChild.textContent.trim();
        title.textContent = label;
      });
    });
  </script>

</body>
</html>
